<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register</title>
<link rel="stylesheet" href="../../assets/css/main.css"><link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head><body>
<header data-include="../../partials/top-nav.html"></header>
<main class="vh-screen auth-wrap">
  <form class="card auth-card" id="registerForm">
    <h2>Register to Clean Street</h2>
    <div class="row">
      <input class="input" name="fullName" placeholder="Full name" required>
      <input class="input" type="email" name="email" placeholder="Email" required>
      <input class="input" name="phone" placeholder="Phone (optional)">
      <input class="input" type="password" name="password" placeholder="Password" required>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="#" onclick="document.getElementById('registerForm').requestSubmit();return false;">Create</a>
      <a class="btn btn-outline" href="./login.html">Login</a>
    </div>
  </form>
</main>
<script type="module">
  import { include } from "../../assets/js/components/include-partials.js";
  include("header[data-include]","../../partials/top-nav.html");
  import "./../../assets/js/pages/register.js";
</script>
</body></html>
