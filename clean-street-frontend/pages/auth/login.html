<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — Clean Street</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#030817;
      --stroke: rgba(255,255,255,0.3);
      --text:#E6F0FF;
      --muted:#9fb1c7;
      --primary:#2D63F0;
      --primary-ghost: rgba(45,99,240,0.12);
      --radius:22px;
      --nav-h:0px;
      --transition:220ms cubic-bezier(.2,.9,.2,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html,body{margin:0;padding:0;overflow:hidden}
    body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}

    .card{width:100%;max-width:560px;border-radius:20px;padding:34px;background:var(--bg);border:1px solid var(--stroke);box-shadow:0 12px 40px rgba(2,8,16,0.6);text-align:center}
    .logo{width:72px;height:72px;margin:0 auto 14px;display:block}
    .title{font-weight:800;font-size:clamp(24px,3vw,34px);margin:6px 0}
    .hint{color:var(--muted);margin-bottom:18px}

    form{max-width:420px;margin:0 auto;text-align:left}
    .label{display:block;color:var(--muted);font-weight:600;margin-bottom:8px}
    .input{width:100%;padding:12px 16px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--text);margin-bottom:16px;outline:none}
    .input::placeholder{color:rgba(255,255,255,0.22)}
    .input:focus{box-shadow:0 8px 28px rgba(2,8,16,0.6);border-color:rgba(255,255,255,0.06)}

    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .checkbox{display:flex;align-items:center;gap:8px;color:var(--muted)}

    .btn{display:block;width:100%;padding:12px 18px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--primary),#1F4DE6);color:#EAF1FF;font-weight:700;cursor:pointer;transition:var(--transition)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(45,94,255,0.12)}

    .link{color:var(--primary);text-decoration:none;font-weight:600}

    .foot{text-align:center;margin-top:14px;color:var(--muted)}
    .foot a{color:var(--primary)}
    @media (max-width:480px){ .card{padding:20px;border-radius:14px} .logo{width:64px;height:64px} .title{font-size:20px} }
  </style>
</head>
<body>
  <section class="card" aria-labelledby="form-title">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c2.2 0 4 1.8 4 4v10.4c0 2 .9 3.9 2.4 5.2 1.3 1.1 3 1.8 4.8 1.8H53c2.2 0 4 1.8 4 4s-1.8 4-4 4H43.2c-1.8 0-3.5.7-4.8 1.8-1.5 1.3-2.4 3.2-2.4 5.2V54c0 2.2-1.8 4-4 4s-4-1.8-4-4V42.6c0-2-.9-3.9-2.4-5.2-1.3-1.1-3-1.8-4.8-1.8H11c-2.2 0-4-1.8-4-4s1.8-4 4-4h10.8c1.8 0 3.5-.7 4.8-1.8 1.5-1.3 2.4-3.2 2.4-5.2V10c0-2.2 1.8-4 4-4z" fill="none" stroke="#2D5EFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="3.2" fill="#2D5EFF"/></svg>

    <h1 id="form-title" class="title">Clean Street</h1>
    <div class="hint">Enter your credentials to sign in</div>

    <form onsubmit="event.preventDefault(); /* hook to backend */">
      <label class="label" for="email">Email</label>
      <input id="email" name="email" class="input" type="email" placeholder="Enter your email" required/>

      <label class="label" for="password">Password</label>
      <input id="password" name="password" class="input" type="password" placeholder="Enter your password" required/>

      <div class="row">
        <label class="checkbox"><input type="checkbox" name="remember" /> Remember me</label>
        <a class="link" href="#">Forgot Password?</a>
      </div>

      <button class="btn" type="submit">Sign In</button>
    </form>

    <div class="foot">Don't have an account? <a href="pages/auth/register.html">Register</a></div>
  </section>
</body>
</html>
