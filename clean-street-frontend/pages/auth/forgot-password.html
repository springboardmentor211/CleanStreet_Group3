<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Forgot Password</title>
<link rel="stylesheet" href="../../assets/css/main.css"><link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head><body>
<header data-include="../../partials/top-nav.html"></header>
<main class="vh-screen auth-wrap">
  <form class="card auth-card" id="forgotForm">
    <h2>Forgot Password</h2>
    <div class="row">
      <input class="input" type="email" name="email" placeholder="Email" required>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="#" onclick="document.getElementById('forgotForm').requestSubmit();return false;">Send</a>
      <a class="btn btn-outline" href="./login.html">Back</a>
    </div>
  </form>
</main>
<script type="module">
  import { include } from "../../assets/js/components/include-partials.js";
  include("header[data-include]","../../partials/top-nav.html");
  import "./../../assets/js/pages/forgot.js";
</script>
</body></html>
