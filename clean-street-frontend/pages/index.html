<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Clean Street — Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#030817;
      --stroke: rgba(255,255,255,0.3);
      --text:#E6F0FF;
      --muted:#9fb1c7;
      --headline:#d6e7f4;
      --teal:#18C5C9;
      --primary:#2D63F0;
      --primary-ghost: rgba(45,99,240,0.12);
      --nav-h:84px;
      --radius:18px;
      --gutter:clamp(14px,2.5vw,28px);
      --transition:220ms cubic-bezier(.2,.9,.2,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html,body{margin:0;padding:0;overflow:hidden} /* keep page non-scrollable */
    body{
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      line-height:1.35;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    /* header */
    header.top-nav{height:var(--nav-h);display:flex;align-items:center;padding:0 var(--gutter);border-bottom:1px solid rgba(255,255,255,0.02)}
    .nav-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .nav-left{display:flex;align-items:center;gap:12px}
    .logo{width:36px;height:36px}
    .brand{font-weight:700}
    nav.links{display:flex;gap:28px}
    nav.links a{color:var(--muted);text-decoration:none;font-weight:500}
    .nav-actions{display:flex;gap:12px}

    /* main hero fits viewport minus nav */
    main.vh{height:calc(100vh - var(--nav-h));display:grid;place-items:center;padding:20px}
    .hero{width:min(1100px,94vw);text-align:center}
    .headline{font-weight:800;color:var(--headline);font-size:clamp(48px,8vw,108px);line-height:1.02;margin:0}
    .headline--bottom{display:block;color:var(--teal)}
    .subcopy{color:var(--muted);font-size:clamp(16px,2.2vw,24px);max-width:1000px;margin:18px auto}

    .cta{display:flex;gap:18px;justify-content:center;margin-top:22px;flex-wrap:wrap}
    .btn{padding:12px 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
    .btn-primary{background:linear-gradient(180deg,var(--primary),#1f4de6);color:#EAF1FF;box-shadow:0 10px 30px rgba(45,94,255,0.12)}
    .btn-outline{background:transparent;border:1px solid var(--stroke);color:var(--text)}

    /* subtle hover tint on container elements */
    .btn:hover{transform:translateY(-3px);transition:var(--transition)}
    .card-hoverable{transition:var(--transition);border:1px solid var(--stroke);background:var(--bg);border-radius:18px;padding:18px}
    .card-hoverable:hover{background:var(--primary-ghost);border-color:var(--primary);box-shadow:0 12px 30px rgba(45,99,240,0.12);transform:translateY(-4px)}

    /* small screens */
    @media (max-width:720px){
      .headline{font-size:clamp(32px,10vw,56px)}
      header.top-nav{padding-left:12px;padding-right:12px}
    }
  </style>
</head>
<body>
  <header class="top-nav" role="banner">
    <div class="nav-inner">
      <div class="nav-left">
    


        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c2.2 0 4 1.8 4 4v10.4c0 2 .9 3.9 2.4 5.2 1.3 1.1 3 1.8 4.8 1.8H53c2.2 0 4 1.8 4 4s-1.8 4-4 4H43.2c-1.8 0-3.5.7-4.8 1.8-1.5 1.3-2.4 3.2-2.4 5.2V54c0 2.2-1.8 4-4 4s-4-1.8-4-4V42.6c0-2-.9-3.9-2.4-5.2-1.3-1.1-3-1.8-4.8-1.8H11c-2.2 0-4-1.8-4-4s1.8-4 4-4h10.8c1.8 0 3.5-.7 4.8-1.8 1.5-1.3 2.4-3.2 2.4-5.2V10c0-2.2 1.8-4 4-4z" fill="none" stroke="#2D5EFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="3.2" fill="#2D5EFF"/></svg>
        <div class="brand">Clean Street</div>
      </div>

      <nav class="links" aria-label="primary">
        <a href="index.html">Dashboard</a>
        <a href="how-we-work.html">How We Work</a>
        <a href="pages/app/community-reports.html">View Complaints</a>
      </nav>

      <div class="nav-actions">
        <button class="btn" onclick="location.href='pages/auth/login.html'">Login</button>
        <button class="btn btn-primary" onclick="location.href='pages/auth/register.html'">Register</button>
      </div>
    </div>
  </header>

  <main class="vh" role="main">
    <section class="hero">
      <h1 class="headline">Make Our City <span class="headline--bottom">Cleaner &amp; Smarter</span></h1>
      <p class="subcopy">Join thousands of citizens making a real difference. Report issues, track progress, and build a cleaner community together.</p>

      <div class="cta">
        <button class="btn btn-primary">+ Report an Issue</button>
        <button class="btn btn-outline">View Report</button>
      </div>
    </section>
  </main>
</body>
</html>
